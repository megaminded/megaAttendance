<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Meals</title>

    <link rel="stylesheet" href="/bootstrap/bootstrap.css">

   <style>
    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
    }

    .heading {
        text-align: center;
        margin-top: 30px;
        margin-bottom: 30px;
        color: #f97316;
        font-size: 45px;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
    }

    .food-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 25px;
        padding-bottom: 30px;
    }

    .food-box {
        background: #ffffff;
        border-radius: 18px;
        overflow: hidden;
        transition: all 0.4s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .food-box:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 15px 35px rgba(249, 115, 22, 0.35);
    }

    .food-box img {
        width: 100%;
        height: 220px;
        object-fit: cover;
    }

    .food-info {
        padding: 18px;
        background: #ffffff;
    }

    .food-info h3 {
        margin-bottom: 12px;
        color: #f97316;
        font-size: 22px;
    }

    .food-info p {
        color: #475569;
        font-size: 14px;
        line-height: 1.6;
    }

    .container {
        max-width: 1200px;
        margin: auto;
    }
</style>
</head>

<body>

    <h1 class="heading">Tasty Meals</h1>

    <div class="container">
        <div id="foodArea" class="food-wrapper"></div>
    </div>

    <script>

        const foodArea = document.getElementById("foodArea");

        let savedMeals = localStorage.getItem("foodData");

        function displayMeals(foodItems) {

            foodItems.forEach((item) => {

                foodArea.innerHTML += `

                <div class="food-box">

                    <img src="${item.strCategoryThumb}" alt="${item.strCategory}">

                    <div class="food-info">

                        <h3>${item.strCategory}</h3>

                        <p>
                            ${item.strCategoryDescription.substring(0, 120)}...
                        </p>

                    </div>

                </div>

                `;

            });

        }

        if (savedMeals) {

            let convertedMeals = JSON.parse(savedMeals);

            displayMeals(convertedMeals);

        } else {

            fetch("https://www.themealdb.com/api/json/v1/1/categories.php")

                .then((result) => result.json())

                .then((responseData) => {

                    localStorage.setItem(
                        "foodData",
                        JSON.stringify(responseData.categories)
                    );

                    displayMeals(responseData.categories);

                })

                .catch((mistake) => {

                    console.log("Something went wrong");

                    console.log(mistake);

                });

        }

    </script>

</body>

</html>
