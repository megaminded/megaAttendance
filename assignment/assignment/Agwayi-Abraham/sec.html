<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minutes and Seconds Countdown</title>

    
        
</head>
<body>

    <div class="timer-box">
        <div id="timer">01:00</div>
    </div>

    <script>

        const timer = document.getElementById("timer");

        // Starting time
        let minutes = 1;
        let seconds = 0;

        function startCountdown(){

            // Display format
            let displayMinutes = String(minutes).padStart(2, '0');
            let displaySeconds = String(seconds).padStart(2, '0');

            timer.innerHTML = `${displayMinutes}:${displaySeconds}`;

            // Countdown logic
            if(seconds === 0){

                if(minutes === 0){
                    // Restart again from 1 minute
                    minutes = 1;
                    seconds = 0;
                }
                else{
                    minutes--;
                    seconds = 59;
                }

            }
            else{
                seconds--;
            }

        }
Z
        // Run every second
        setInterval(startCountdown, 1000);

    </script>

</body>
</html>
